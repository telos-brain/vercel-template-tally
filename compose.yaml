# Optional local stack (TEL1276). Default path is still `npm run prepare` + `npm run dev`.
#
# App only (Supabase + Brain already up via prepare):
#   docker compose up -d
#
# Docker-only (init runs prepare.mjs via the host Docker socket, then starts the app):
#   docker compose --profile stack up -d
#
# Brain still starts with `brain start` (TEL1251), not a hand-written Brain+SQL service.
# Requires Docker Compose v2.24+ (`depends_on.required`, optional `env_file`).

services:
  app:
    build:
      context: .
      target: dev
    ports:
      - "3000:3000"
    env_file:
      - path: .env
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      WATCHPACK_POLLING: "true"
      TEL_SKIP_PREPARE: "1"
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
    depends_on:
      init:
        condition: service_completed_successfully
        required: false
    networks:
      - tally

  init:
    profiles: [stack]
    build:
      context: .
      target: stack-init
    working_dir: /app
    env_file:
      - path: .env
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TEL_COMPOSE: "1"
      TEL_SKIP_PREPARE: "0"
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
      - /var/run/docker.sock:/var/run/docker.sock
    restart: "no"
    networks:
      - tally
    command: ["node", "scripts/prepare.mjs"]

volumes:
  app_node_modules:

networks:
  tally:
    driver: bridge
